name: Release Mobile

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

permissions:
  contents: read

concurrency:
  group: release-mobile-production
  cancel-in-progress: false

jobs:
  build-android:
    name: Build signed Android APK and AAB
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test mobile application
        run: |
          node --test mobile/scripts/androidReleaseConfig.test.mjs
          pnpm --filter rpbox-mobile test
          pnpm --filter rpbox-mobile type-check

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          REF="${GITHUB_REF#refs/*/}"
          PACKAGE_VERSION=$(node -p "require('./mobile/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/mobile-v* ]]; then
            VERSION="${REF#mobile-v}"
            if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
              echo "ERROR: mobile tag version must exactly match mobile/package.json (${PACKAGE_VERSION})."
              exit 1
            fi
          else
            VERSION="$PACKAGE_VERSION"
          fi
          VERSION_CODE="$(ANDROID_RELEASE_VERSION="$VERSION" node ./mobile/scripts/androidReleaseConfig.mjs version-code)"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Sync mobile package version
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          export VERSION
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"].strip()
          package_path = Path("mobile/package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package["version"] = version
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Resolve and preflight production endpoints
        shell: bash
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          MOBILE_RELEASE_BASE_URL: ${{ secrets.MOBILE_RELEASE_BASE_URL }}
          RELEASE_BASE_URL: ${{ secrets.RELEASE_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_API_BASE:-}" ]; then
            VITE_API_BASE="https://ksxvodevhonx.sealosbja.site/api/v1"
          fi
          VITE_API_BASE="$(VITE_API_BASE="$VITE_API_BASE" node ./mobile/scripts/androidReleaseConfig.mjs validate-api-base)"
          VITE_API_BASE="$VITE_API_BASE" node ./mobile/scripts/androidReleaseConfig.mjs check-api-reachability

          if [ -n "${MOBILE_RELEASE_BASE_URL:-}" ]; then
            ANDROID_RELEASE_BASE_URL="$MOBILE_RELEASE_BASE_URL"
          elif [ -n "${RELEASE_BASE_URL:-}" ]; then
            ANDROID_RELEASE_BASE_URL="${RELEASE_BASE_URL%/}/mobile"
          else
            ANDROID_RELEASE_BASE_URL="https://ksxvodevhonx.sealosbja.site/releases/mobile"
          fi
          ANDROID_RELEASE_BASE_URL="$(ANDROID_RELEASE_BASE_URL="$ANDROID_RELEASE_BASE_URL" node ./mobile/scripts/androidReleaseConfig.mjs validate-release-base)"
          if ! curl --silent --output /dev/null --head \
            --proto '=https' \
            --proto-redir '=https' \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 2 \
            --retry-all-errors \
            "$ANDROID_RELEASE_BASE_URL"; then
            echo "ERROR: Android release host DNS/TLS preflight failed."
            exit 1
          fi

          printf 'VITE_API_BASE=%s\n' "$VITE_API_BASE" >> "$GITHUB_ENV"
          printf 'ANDROID_RELEASE_BASE_URL=%s\n' "$ANDROID_RELEASE_BASE_URL" >> "$GITHUB_ENV"

      - name: Build mobile web assets
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter rpbox-mobile build
          if ! grep -R -F -q --include='*.js' --include='*.html' -- "$VITE_API_BASE" mobile/dist; then
            echo "ERROR: validated production API was not embedded in the Android web bundle."
            exit 1
          fi
          if grep -R -E -q --include='*.js' --include='*.html' -- 'https?://(localhost|127\.[0-9.]+)(:[0-9]+)?/api/v1' mobile/dist; then
            echo "ERROR: localhost API fallback was embedded in the Android web bundle."
            exit 1
          fi

      - name: Prepare Android project
        run: |
          cd mobile
          if [ ! -d android ]; then
            pnpm exec cap add android
          fi
          pnpm dlx @capacitor/assets@3.0.5 generate --android
          pnpm exec cap sync android
          node ./scripts/prepareNativeShare.mjs android

      - name: Sync Android native version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          VERSION_CODE="${{ steps.version.outputs.VERSION_CODE }}"
          export VERSION VERSION_CODE
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"].strip()
          version_code = int(os.environ["VERSION_CODE"])

          gradle_files = [
            Path("mobile/android/app/build.gradle"),
            Path("mobile/android/app/build.gradle.kts"),
          ]
          target = None
          for path in gradle_files:
            if path.exists():
              target = path
              break
          if target is None:
            raise FileNotFoundError("android app gradle file not found")

          text = target.read_text(encoding="utf-8")

          if target.suffix == ".kts":
            text = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {version_code}', text)
            text = re.sub(r'versionName\s*=\s*"[^"]*"', f'versionName = "{version}"', text)
          else:
            text = re.sub(r'versionCode\s+\d+', f'versionCode {version_code}', text)
            text = re.sub(r'versionName\s+"[^"]*"', f'versionName "{version}"', text)

          target.write_text(text, encoding="utf-8")
          print(f"synced native version: versionName={version}, versionCode={version_code}, file={target}")
          PY

      - name: Build signed release APK and AAB
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_SIGNING_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_SIGNING_STORE_PASSWORD:-}" ] || [ -z "${ANDROID_SIGNING_KEY_ALIAS:-}" ] || [ -z "${ANDROID_SIGNING_KEY_PASSWORD:-}" ]; then
            echo "ERROR: Android signing secrets are missing."
            exit 1
          fi

          KEYSTORE_PATH="mobile/android/app/rpbox-upload-release.jks"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          KEYSTORE_ABSOLUTE_PATH="$(realpath "$KEYSTORE_PATH")"

          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_ABSOLUTE_PATH" \
            -Pandroid.injected.signing.store.password="$ANDROID_SIGNING_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_SIGNING_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_SIGNING_KEY_PASSWORD"

      - name: Verify signatures and prepare artifacts and metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES_FILE="mobile/release-notes/${VERSION}.txt"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ANDROID_RELEASE_BASE_URL="$(ANDROID_RELEASE_BASE_URL="${ANDROID_RELEASE_BASE_URL:-}" node ./mobile/scripts/androidReleaseConfig.mjs validate-release-base)"

          mkdir -p artifacts

          APK_PATH=$(find mobile/android/app/build/outputs/apk/release -name "*release*.apk" -type f -print -quit)
          AAB_PATH=$(find mobile/android/app/build/outputs/bundle/release -name "*.aab" -type f -print -quit)
          [ -z "$APK_PATH" ] && { echo "ERROR: apk artifact not found"; exit 1; }
          [ -z "$AAB_PATH" ] && { echo "ERROR: aab artifact not found"; exit 1; }

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          [ -z "$APKSIGNER" ] && { echo "ERROR: apksigner not found"; exit 1; }
          "$APKSIGNER" verify "$APK_PATH" >/dev/null

          if ! AAB_VERIFY_OUTPUT=$(LC_ALL=C jarsigner -verify "$AAB_PATH" 2>&1); then
            echo "ERROR: Android App Bundle signature verification failed"
            exit 1
          fi
          if ! grep -q "jar verified" <<< "$AAB_VERIFY_OUTPUT"; then
            echo "ERROR: Android App Bundle signature verification failed"
            exit 1
          fi

          cp "$APK_PATH" "artifacts/RPBox_${VERSION}_android.apk"
          cp "$AAB_PATH" "artifacts/RPBox_${VERSION}_android.aab"

          export VERSION NOTES_FILE PUB_DATE ANDROID_RELEASE_BASE_URL
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"].strip()
          notes_file = Path(os.environ["NOTES_FILE"])
          pub_date = os.environ["PUB_DATE"].strip()
          release_base_url = os.environ["ANDROID_RELEASE_BASE_URL"].rstrip("/")

          notes = ""
          if notes_file.exists():
            notes = notes_file.read_text(encoding="utf-8").strip().replace("\r\n", "\n").replace("\r", "\n")

          data = {
            "latest_version": version,
            "version": version,
            "notes": notes,
            "pub_date": pub_date,
            "url": f"{release_base_url}/{version}/RPBox_{version}_android.apk",
            "mandatory": False,
          }
          Path("artifacts/latest-android.json").write_text(
            json.dumps(data, ensure_ascii=False, indent=2) + "\n",
            encoding="utf-8",
          )

          expected_filename = f"RPBox_{version}_android.apk"
          expected_url = f"{release_base_url}/{version}/{expected_filename}"
          if data["url"] != expected_url or not Path("artifacts", expected_filename).is_file():
            raise RuntimeError("Android metadata URL and deployed APK filename disagree")
          PY

      - name: Remove Android signing material
        if: always()
        shell: bash
        run: rm -f mobile/android/app/rpbox-upload-release.jks

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-artifacts
          path: artifacts/**
          if-no-files-found: error
          retention-days: 30

  deploy-android:
    name: Deploy Android Release
    runs-on: ubuntu-latest
    needs: build-android

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: mobile-android-artifacts
          path: artifacts

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          [ -n "${SERVER_HOST:-}" ] || { echo "ERROR: SERVER_HOST is missing"; exit 1; }
          ssh-keyscan -H -p 2233 "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload Android release and metadata
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          MOBILE_RELEASE_PATH: ${{ secrets.MOBILE_RELEASE_PATH }}
          RELEASE_PATH: ${{ secrets.RELEASE_PATH }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.build-android.outputs.version }}"
          REMOTE_BASE="${MOBILE_RELEASE_PATH:-}"
          if [ -z "$REMOTE_BASE" ] && [ -n "${RELEASE_PATH:-}" ]; then
            REMOTE_BASE="${RELEASE_PATH%/}/mobile"
          fi
          [ -n "${SERVER_HOST:-}" ] && [ -n "${SERVER_USER:-}" ] || { echo "ERROR: Android deploy host/user is missing"; exit 1; }
          [[ "$REMOTE_BASE" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "ERROR: Android remote release path is missing or unsafe"; exit 1; }
          [[ "/$REMOTE_BASE/" != *"/../"* ]] || { echo "ERROR: Android remote release path must not contain parent traversal"; exit 1; }
          REMOTE_DIR="$REMOTE_BASE/$VERSION"
          REMOTE_TARGET="${SERVER_USER}@${SERVER_HOST}"

          APK_PATH="artifacts/RPBox_${VERSION}_android.apk"
          AAB_PATH="artifacts/RPBox_${VERSION}_android.aab"
          META_PATH="artifacts/latest-android.json"
          [ ! -f "$APK_PATH" ] && { echo "ERROR: apk artifact missing"; exit 1; }
          [ ! -f "$AAB_PATH" ] && { echo "ERROR: aab artifact missing from Actions artifact"; exit 1; }
          [ ! -f "$META_PATH" ] && { echo "ERROR: latest-android.json missing"; exit 1; }

          ssh -p 2233 "$REMOTE_TARGET" "mkdir -p '$REMOTE_DIR' '$REMOTE_BASE'"

          REMOTE_APK_FINAL="$REMOTE_DIR/RPBox_${VERSION}_android.apk"
          REMOTE_APK_TMP="$REMOTE_APK_FINAL.part"
          REMOTE_META_VER_FINAL="$REMOTE_DIR/latest-android.json"
          REMOTE_META_VER_TMP="$REMOTE_META_VER_FINAL.part"
          REMOTE_META_LATEST_FINAL="$REMOTE_BASE/latest-android.json"
          REMOTE_META_LATEST_TMP="$REMOTE_META_LATEST_FINAL.part"

          scp -P 2233 -C "$APK_PATH" "$REMOTE_TARGET:$REMOTE_APK_TMP"
          ssh -p 2233 "$REMOTE_TARGET" "mv -f '$REMOTE_APK_TMP' '$REMOTE_APK_FINAL'"

          scp -P 2233 -C "$META_PATH" "$REMOTE_TARGET:$REMOTE_META_VER_TMP"
          ssh -p 2233 "$REMOTE_TARGET" "mv -f '$REMOTE_META_VER_TMP' '$REMOTE_META_VER_FINAL'"

          scp -P 2233 -C "$META_PATH" "$REMOTE_TARGET:$REMOTE_META_LATEST_TMP"
          ssh -p 2233 "$REMOTE_TARGET" "mv -f '$REMOTE_META_LATEST_TMP' '$REMOTE_META_LATEST_FINAL'"

  update-pages:
    name: Update GitHub Pages
    runs-on: ubuntu-latest
    needs:
      - build-android
      - deploy-android
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve exact built version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.build-android.outputs.version }}"
          [ -n "$VERSION" ] || { echo "ERROR: exact built Android version is missing"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update fallback mobile version in download.html
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          sed -i "s/var fallbackAndroidVersion = '.*'/var fallbackAndroidVersion = '${VERSION}'/" shared/download.html
          echo "Updated fallbackAndroidVersion to ${VERSION}"
          grep fallbackAndroidVersion shared/download.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shared/download.html
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update download page fallback mobile version to mobile-v${{ steps.version.outputs.VERSION }}"
          git push origin main
