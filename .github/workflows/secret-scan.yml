name: Secret Scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks full-history scan
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.24.3
      GITLEAKS_ARCHIVE_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
      GIT_TERMINAL_PROMPT: 0
    steps:
      - name: Fetch every Git ref without credentials
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch \
            --force \
            --no-tags \
            --prune \
            --no-recurse-submodules \
            origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'
          git -c protocol.version=2 fetch \
            --force \
            --no-tags \
            --no-recurse-submodules \
            origin \
            "${GITHUB_REF}"
          git cat-file --exit-code "${GITHUB_SHA}^{commit}"
          git -c submodule.recurse=false checkout \
            --detach \
            --no-recurse-submodules \
            "${GITHUB_SHA}"

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          binary="${RUNNER_TEMP}/gitleaks"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --status
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" gitleaks
          chmod 0755 "${binary}"
          "${binary}" version

      - name: Scan every Git ref with redaction
        shell: bash
        run: >-
          "${RUNNER_TEMP}/gitleaks" git
          --log-opts="--all"
          --redact=100
          --no-banner
          .
