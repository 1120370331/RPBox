name: Release iOS TestFlight

on:
  push:
    tags:
      - 'ios-v*'
      - 'mobile-ios-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'iOS version; must match mobile/ios/release.json (for example 1.1)'
        required: false
      build_number:
        description: 'Optional retry build number; must be numeric and higher than the tracked iOS build'
        required: false
      release_notes:
        description: 'Override release notes (optional)'
        required: false
      groups:
        description: 'Comma separated TestFlight groups (optional)'
        required: false
      deploy_public_metadata:
        description: 'Deploy latest-ios.json only after this version is already public on the App Store'
        type: boolean
        required: false
        default: false

env:
  NODE_VERSION: '20'
  XCODE_WORKSPACE: 'mobile/ios/App/App.xcworkspace'
  XCODE_SCHEME: 'App'
  IOS_DEFAULT_API_BASE: 'https://ksxvodevhonx.sealosbja.site/api/v1'
  IOS_APP_STORE_ID: '6761112311'
  IOS_DEFAULT_PUBLIC_URL: 'https://apps.apple.com/cn/app/rpbox/id6761112311'

jobs:
  build-and-upload:
    name: Build and Upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 90
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.deploy_public_metadata }}
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphoneos|iOS"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Ensure CocoaPods is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods -N
          fi
          pod --version

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail

          CONTRACT_VALUES="$(node ./mobile/scripts/iosCompliance.mjs release-contract)"
          read -r TRACKED_VERSION TRACKED_BUILD_NUMBER <<< "$CONTRACT_VALUES"

          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
          elif [[ "${GITHUB_REF:-}" == refs/tags/ios-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/ios-v}"
          elif [[ "${GITHUB_REF:-}" == refs/tags/mobile-ios-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/mobile-ios-v}"
          else
            VERSION="$TRACKED_VERSION"
          fi

          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi
          if [ "$VERSION" != "$TRACKED_VERSION" ]; then
            echo "Requested iOS version must exactly match mobile/ios/release.json"
            exit 1
          fi

          if [ -n "${INPUT_BUILD_NUMBER:-}" ]; then
            if ! [[ "$INPUT_BUILD_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]; then
              echo "Manual iOS build number must contain 1 to 10 decimal digits without leading zeroes"
              exit 1
            fi
            if [ "$INPUT_BUILD_NUMBER" -le "$TRACKED_BUILD_NUMBER" ] || [ "$INPUT_BUILD_NUMBER" -gt 2147483647 ]; then
              echo "Manual iOS build number must be higher than the tracked build and no greater than 2147483647"
              exit 1
            fi
            BUILD_NUMBER="$INPUT_BUILD_NUMBER"
          else
            BUILD_NUMBER="$TRACKED_BUILD_NUMBER"
          fi

          if ! [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "Invalid tracked iOS build number"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Resolve release notes
        id: notes
        shell: bash
        env:
          INPUT_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES_FILE="mobile/release-notes/${VERSION}.txt"

          if [ ! -f "$NOTES_FILE" ] || ! grep -q '[^[:space:]]' "$NOTES_FILE"; then
            echo "Release notes file is missing or empty: $NOTES_FILE"
            exit 1
          fi

          if [ -n "${INPUT_NOTES:-}" ]; then
            NOTES="$INPUT_NOTES"
          else
            NOTES="$(cat "$NOTES_FILE")"
          fi
          if ! grep -q '[^[:space:]]' <<< "$NOTES"; then
            echo "Resolved release notes must not be empty"
            exit 1
          fi

          NOTES_DELIMITER="RPBOX_NOTES_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          if grep -Fxq "$NOTES_DELIMITER" <<< "$NOTES"; then
            echo "Resolved release notes contain the reserved output delimiter"
            exit 1
          fi
          {
            echo "NOTES<<$NOTES_DELIMITER"
            echo "$NOTES"
            echo "$NOTES_DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test mobile application
        run: |
          node --test mobile/scripts/iosCompliance.test.mjs
          node --test mobile/scripts/appStoreSubmitWorkflow.test.mjs
          pnpm --filter rpbox-mobile test
          pnpm --filter rpbox-mobile type-check

      - name: Resolve mobile API
        shell: bash
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_API_BASE:-}" ]; then
            VITE_API_BASE="${{ env.IOS_DEFAULT_API_BASE }}"
          fi
          VITE_API_BASE="$(IOS_API_BASE="$VITE_API_BASE" node ./mobile/scripts/iosCompliance.mjs validate-api-base)"
          export VITE_API_BASE
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const apiBase = new URL(process.env.VITE_API_BASE)
          const apiPrefix = apiBase.pathname.replace(/\/+$/, '')
          const healthUrl = new URL('/health', apiBase.origin)
          const databaseUrl = new URL(`${apiPrefix}/rpdb/works`, apiBase.origin)
          databaseUrl.searchParams.set('page', '1')
          databaseUrl.searchParams.set('page_size', '1')

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `VITE_API_BASE=${apiBase.href}\nIOS_EXPECTED_API_BASE=${apiBase.href}\nIOS_API_HEALTH_URL=${healthUrl.href}\nIOS_API_DATABASE_URL=${databaseUrl.href}\n`,
          )
          NODE

      - name: Preflight production API
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_RESPONSE="$RUNNER_TEMP/ios-api-health.json"
          DATABASE_RESPONSE="$RUNNER_TEMP/ios-api-database.json"
          CURL_OPTIONS=(--fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 30 --retry 2)

          curl "${CURL_OPTIONS[@]}" "$IOS_API_HEALTH_URL" --output "$HEALTH_RESPONSE"
          curl "${CURL_OPTIONS[@]}" -H 'Accept: application/json' "$IOS_API_DATABASE_URL" --output "$DATABASE_RESPONSE"

          HEALTH_RESPONSE="$HEALTH_RESPONSE" DATABASE_RESPONSE="$DATABASE_RESPONSE" node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const health = JSON.parse(fs.readFileSync(process.env.HEALTH_RESPONSE, 'utf8'))
          const database = JSON.parse(fs.readFileSync(process.env.DATABASE_RESPONSE, 'utf8'))
          if (health?.status !== 'ok') throw new Error('Production API health response is not healthy')
          if (!Array.isArray(database?.works)) throw new Error('Production API RPDB response is not DB-backed work data')
          NODE

      - name: Build mobile web assets
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter rpbox-mobile build

      - name: Prepare iOS project
        shell: bash
        run: |
          set -euo pipefail
          cd mobile
          if [ ! -d ios/App ]; then
            pnpm exec cap add ios
          fi
          if [ ! -f ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png ]; then
            pnpm dlx @capacitor/assets@3.0.5 generate --ios
          fi
          pnpm exec cap sync ios
          node ./scripts/prepareNativeShare.mjs ios
          test -f ios/App/App.xcworkspace/contents.xcworkspacedata
          test -f ios/App/Podfile.lock
          test -f ios/App/Pods/Manifest.lock

      - name: Verify iOS privacy and camera setup
        shell: bash
        run: |
          set -euo pipefail
          INFO_PLIST="mobile/ios/App/App/Info.plist"
          PRIVACY_MANIFEST="mobile/ios/App/App/PrivacyInfo.xcprivacy"
          CAP_CONFIG="mobile/ios/App/App/capacitor.config.json"

          plutil -lint "$INFO_PLIST" "$PRIVACY_MANIFEST"
          grep -q "<key>NSCameraUsageDescription</key>" "$INFO_PLIST"
          grep -q "<key>NSPhotoLibraryUsageDescription</key>" "$INFO_PLIST"
          grep -q "<key>NSPhotoLibraryAddUsageDescription</key>" "$INFO_PLIST"
          grep -q "<key>ITSAppUsesNonExemptEncryption</key>" "$INFO_PLIST"
          grep -q "<key>NSPrivacyTracking</key>" "$PRIVACY_MANIFEST"
          grep -q "<key>NSPrivacyTrackingDomains</key>" "$PRIVACY_MANIFEST"
          grep -q "\"CAPCameraPlugin\"" "$CAP_CONFIG"

      - name: Resolve iOS scheme
        shell: bash
        run: |
          set -euo pipefail
          SCHEME="${{ env.XCODE_SCHEME }}"
          if xcodebuild -list -workspace "${{ env.XCODE_WORKSPACE }}" | grep -q " $SCHEME$"; then
            echo "Using configured scheme: $SCHEME"
            echo "RESOLVED_XCODE_SCHEME=$SCHEME" >> "$GITHUB_ENV"
            exit 0
          fi

          RESOLVED_SCHEME="$(xcodebuild -list -json -workspace "${{ env.XCODE_WORKSPACE }}" | python3 -c 'import json,sys; d=json.load(sys.stdin); schemes=d.get("workspace",{}).get("schemes",[]); print(schemes[0] if schemes else "")')"
          if [ -z "$RESOLVED_SCHEME" ]; then
            echo "No iOS scheme found in workspace."
            exit 1
          fi
          echo "Using detected scheme: $RESOLVED_SCHEME"
          echo "RESOLVED_XCODE_SCHEME=$RESOLVED_SCHEME" >> "$GITHUB_ENV"

      - name: Sync iOS native version
        shell: bash
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_PROVISION_PROFILE_NAME: ${{ secrets.IOS_PROVISION_PROFILE_NAME }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          BUILD_NUMBER="${{ steps.version.outputs.BUILD_NUMBER }}"
          PBXPROJ="mobile/ios/App/App.xcodeproj/project.pbxproj"

          if [ -z "${IOS_TEAM_ID:-}" ] || [ -z "${IOS_BUNDLE_ID:-}" ] || [ -z "${IOS_PROVISION_PROFILE_NAME:-}" ]; then
            echo "Missing IOS_TEAM_ID / IOS_BUNDLE_ID / IOS_PROVISION_PROFILE_NAME"
            exit 1
          fi

          perl -0777 -i -pe "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = ${VERSION};/g" "$PBXPROJ"
          perl -0777 -i -pe "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" "$PBXPROJ"
          perl -0777 -i -pe "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/PRODUCT_BUNDLE_IDENTIFIER = ${IOS_BUNDLE_ID};/g" "$PBXPROJ"
          perl -0777 -i -pe "s/CODE_SIGN_STYLE = [^;]+;/CODE_SIGN_STYLE = Manual;/g" "$PBXPROJ"
          if grep -q "DEVELOPMENT_TEAM =" "$PBXPROJ"; then
            perl -0777 -i -pe "s/DEVELOPMENT_TEAM = [^;]+;/DEVELOPMENT_TEAM = ${IOS_TEAM_ID};/g" "$PBXPROJ"
          else
            perl -0777 -i -pe "s/(CODE_SIGN_STYLE = Manual;)/\\1\\n\\t\\t\\t\\tDEVELOPMENT_TEAM = ${IOS_TEAM_ID};/g" "$PBXPROJ"
          fi
          if grep -q "PROVISIONING_PROFILE_SPECIFIER =" "$PBXPROJ"; then
            perl -0777 -i -pe "s/PROVISIONING_PROFILE_SPECIFIER = [^;]+;/PROVISIONING_PROFILE_SPECIFIER = \"${IOS_PROVISION_PROFILE_NAME}\";/g" "$PBXPROJ"
          else
            perl -0777 -i -pe "s/(PRODUCT_BUNDLE_IDENTIFIER = ${IOS_BUNDLE_ID};)/\\1\\n\\t\\t\\t\\tPROVISIONING_PROFILE_SPECIFIER = \"${IOS_PROVISION_PROFILE_NAME}\";/g" "$PBXPROJ"
          fi

      - name: Verify generated iOS project
        env:
          IOS_EXPECTED_VERSION: ${{ steps.version.outputs.VERSION }}
          IOS_EXPECTED_BUILD_NUMBER: ${{ steps.version.outputs.BUILD_NUMBER }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_PROVISION_PROFILE_NAME: ${{ secrets.IOS_PROVISION_PROFILE_NAME }}
          IOS_REQUIRE_GENERATED_WORKSPACE: 'true'
        run: pnpm --filter rpbox-mobile verify:ios-project

      - name: Install signing assets
        shell: bash
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${IOS_P12_BASE64:-}" ] || [ -z "${IOS_P12_PASSWORD:-}" ] || [ -z "${IOS_PROVISION_PROFILE_BASE64:-}" ]; then
            echo "Missing iOS signing secrets."
            exit 1
          fi

          KEYCHAIN_PASSWORD="${IOS_KEYCHAIN_PASSWORD:-}"
          if [ -z "$KEYCHAIN_PASSWORD" ]; then
            KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          fi
          KEYCHAIN_NAME="build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo "$IOS_P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security default-keychain -s "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security import "$CERT_PATH" -k "$KEYCHAIN_NAME" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Create export options plist
        shell: bash
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_PROVISION_PROFILE_NAME: ${{ secrets.IOS_PROVISION_PROFILE_NAME }}
        run: |
          set -euo pipefail

          if [ -z "${IOS_TEAM_ID:-}" ] || [ -z "${IOS_BUNDLE_ID:-}" ] || [ -z "${IOS_PROVISION_PROFILE_NAME:-}" ]; then
            echo "Missing IOS_TEAM_ID / IOS_BUNDLE_ID / IOS_PROVISION_PROFILE_NAME"
            exit 1
          fi

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${IOS_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                <key>${IOS_BUNDLE_ID}</key>
                <string>${IOS_PROVISION_PROFILE_NAME}</string>
              </dict>
            </dict>
          </plist>
          EOF

      - name: Build archive
        shell: bash
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          SCHEME="${RESOLVED_XCODE_SCHEME:-}"
          if [ -z "$SCHEME" ]; then
            echo "No resolved iOS scheme is available."
            exit 1
          fi
          xcodebuild \
            -workspace "${{ env.XCODE_WORKSPACE }}" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/RPBox.xcarchive" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            clean archive

      - name: Export IPA
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/RPBox.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Verify exported IPA
        shell: bash
        env:
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          EXPECTED_VERSION: ${{ steps.version.outputs.VERSION }}
          EXPECTED_BUILD_NUMBER: ${{ steps.version.outputs.BUILD_NUMBER }}
        run: |
          set -euo pipefail

          IPA_COUNT="$(find "$RUNNER_TEMP/export" -type f -name '*.ipa' | wc -l | tr -d '[:space:]')"
          if [ "$IPA_COUNT" != "1" ]; then
            echo "Expected exactly one exported IPA, found $IPA_COUNT"
            exit 1
          fi
          IPA_PATH="$(find "$RUNNER_TEMP/export" -type f -name '*.ipa' -print -quit)"
          VERIFY_DIR="$RUNNER_TEMP/ipa-verification"
          mkdir -p "$VERIFY_DIR"
          ditto -x -k "$IPA_PATH" "$VERIFY_DIR"

          APP_COUNT="$(find "$VERIFY_DIR/Payload" -mindepth 1 -maxdepth 1 -type d -name '*.app' | wc -l | tr -d '[:space:]')"
          if [ "$APP_COUNT" != "1" ]; then
            echo "Expected exactly one application in the IPA payload, found $APP_COUNT"
            exit 1
          fi
          APP_PATH="$(find "$VERIFY_DIR/Payload" -mindepth 1 -maxdepth 1 -type d -name '*.app' -print -quit)"
          APP_INFO="$APP_PATH/Info.plist"
          APP_PRIVACY_MANIFEST="$APP_PATH/PrivacyInfo.xcprivacy"
          EMBEDDED_PROFILE="$APP_PATH/embedded.mobileprovision"
          DECODED_PROFILE="$VERIFY_DIR/embedded-profile.plist"
          SIGNED_ENTITLEMENTS="$VERIFY_DIR/signed-entitlements.plist"

          test -f "$APP_INFO"
          test -f "$APP_PRIVACY_MANIFEST"
          test -f "$EMBEDDED_PROFILE"
          plutil -lint "$APP_INFO" "$APP_PRIVACY_MANIFEST"

          ACTUAL_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_INFO")"
          ACTUAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_INFO")"
          ACTUAL_BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_INFO")"
          USES_NON_EXEMPT_ENCRYPTION="$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$APP_INFO")"

          [ "$ACTUAL_BUNDLE_ID" = "$IOS_BUNDLE_ID" ] || { echo "Exported IPA bundle identifier mismatch"; exit 1; }
          [ "$ACTUAL_VERSION" = "$EXPECTED_VERSION" ] || { echo "Exported IPA version mismatch"; exit 1; }
          [ "$ACTUAL_BUILD_NUMBER" = "$EXPECTED_BUILD_NUMBER" ] || { echo "Exported IPA build number mismatch"; exit 1; }
          [ "$USES_NON_EXEMPT_ENCRYPTION" = "false" ] || { echo "Exported IPA encryption declaration must be false"; exit 1; }

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" > "$SIGNED_ENTITLEMENTS" 2> "$VERIFY_DIR/codesign-entitlements.log"
          test -s "$SIGNED_ENTITLEMENTS"
          plutil -lint "$SIGNED_ENTITLEMENTS"
          security cms -D -i "$EMBEDDED_PROFILE" > "$DECODED_PROFILE"
          plutil -lint "$DECODED_PROFILE"

          APPLICATION_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$SIGNED_ENTITLEMENTS")"
          TEAM_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.team-identifier' "$SIGNED_ENTITLEMENTS")"
          PROFILE_APPLICATION_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$DECODED_PROFILE")"
          [ "$APPLICATION_IDENTIFIER" = "$PROFILE_APPLICATION_IDENTIFIER" ] || { echo "Signed application identifier does not match the embedded profile"; exit 1; }
          [[ "$APPLICATION_IDENTIFIER" == *."$IOS_BUNDLE_ID" ]] || { echo "Signed application identifier bundle suffix mismatch"; exit 1; }
          [ "$TEAM_IDENTIFIER" = "$IOS_TEAM_ID" ] || { echo "Signed team identifier mismatch"; exit 1; }
          grep -Fq '<string>applinks:totalrpbox.com</string>' "$SIGNED_ENTITLEMENTS"
          grep -Fq '<string>applinks:www.totalrpbox.com</string>' "$SIGNED_ENTITLEMENTS"

          echo "IOS_IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Install fastlane
        run: gem install fastlane -NV

      - name: Upload to TestFlight
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          IOS_TESTFLIGHT_GROUPS: ${{ github.event.inputs.groups || secrets.IOS_TESTFLIGHT_GROUPS }}
          RELEASE_NOTES: ${{ steps.notes.outputs.NOTES }}
          KEY_P8_PATH: ${{ runner.temp }}/AuthKey.p8
          API_KEY_JSON: ${{ runner.temp }}/asc-api-key.json
        run: |
          set -euo pipefail

          if [ -z "${ASC_ISSUER_ID:-}" ] || [ -z "${ASC_KEY_ID:-}" ] || [ -z "${ASC_API_KEY_BASE64:-}" ]; then
            echo "Missing App Store Connect API key secrets."
            exit 1
          fi

          IPA_PATH="${IOS_IPA_PATH:-}"
          if [ -z "$IPA_PATH" ] || [ ! -f "$IPA_PATH" ]; then
            echo "IPA not found."
            exit 1
          fi

          KEY_P8_PATH="$RUNNER_TEMP/AuthKey.p8"
          API_KEY_JSON="$RUNNER_TEMP/asc-api-key.json"
          echo "$ASC_API_KEY_BASE64" | base64 --decode > "$KEY_P8_PATH"
          chmod 600 "$KEY_P8_PATH"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          key_p8 = Path(os.environ["KEY_P8_PATH"]).read_text(encoding="utf-8")
          payload = {
              "key_id": os.environ["ASC_KEY_ID"],
              "issuer_id": os.environ["ASC_ISSUER_ID"],
              "key": key_p8,
              "in_house": False
          }
          Path(os.environ["API_KEY_JSON"]).write_text(json.dumps(payload), encoding="utf-8")
          PY
          chmod 600 "$API_KEY_JSON"

          if [ -n "${IOS_TESTFLIGHT_GROUPS:-}" ]; then
            fastlane pilot upload \
              --ipa "$IPA_PATH" \
              --api_key_path "$API_KEY_JSON" \
              --skip_waiting_for_build_processing false \
              --wait_processing_interval 30 \
              --changelog "$RELEASE_NOTES" \
              --distribute_external false \
              --groups "$IOS_TESTFLIGHT_GROUPS"
          else
            fastlane pilot upload \
              --ipa "$IPA_PATH" \
              --api_key_path "$API_KEY_JSON" \
              --skip_waiting_for_build_processing false \
              --wait_processing_interval 30 \
              --changelog "$RELEASE_NOTES" \
              --distribute_external false
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-artifacts
          path: |
            ${{ runner.temp }}/RPBox.xcarchive
            ${{ runner.temp }}/export
            ${{ runner.temp }}/ExportOptions.plist
            ${{ runner.temp }}/ipa-verification/signed-entitlements.plist
          if-no-files-found: warn

  deploy-ios-metadata:
    name: Deploy iOS Metadata
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_public_metadata }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          CONTRACT_VALUES="$(node ./mobile/scripts/iosCompliance.mjs release-contract)"
          read -r TRACKED_VERSION TRACKED_BUILD_NUMBER <<< "$CONTRACT_VALUES"
          VERSION="${INPUT_VERSION:-$TRACKED_VERSION}"
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?$ ]]; then
            echo "Invalid metadata version"
            exit 1
          fi
          if [ "$VERSION" != "$TRACKED_VERSION" ]; then
            echo "Metadata version must exactly match mobile/ios/release.json"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve release notes
        id: notes
        shell: bash
        env:
          INPUT_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES_FILE="mobile/release-notes/${VERSION}.txt"

          if [ ! -f "$NOTES_FILE" ] || ! grep -q '[^[:space:]]' "$NOTES_FILE"; then
            echo "Release notes file is missing or empty: $NOTES_FILE"
            exit 1
          fi

          if [ -n "${INPUT_NOTES:-}" ]; then
            NOTES="$INPUT_NOTES"
          else
            NOTES="$(cat "$NOTES_FILE")"
          fi
          if ! grep -q '[^[:space:]]' <<< "$NOTES"; then
            echo "Resolved release notes must not be empty"
            exit 1
          fi

          NOTES_DELIMITER="RPBOX_NOTES_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          if grep -Fxq "$NOTES_DELIMITER" <<< "$NOTES"; then
            echo "Resolved release notes contain the reserved output delimiter"
            exit 1
          fi
          {
            echo "NOTES<<$NOTES_DELIMITER"
            echo "$NOTES"
            echo "$NOTES_DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Verify version is already public on the App Store
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          LOOKUP_RESPONSE="$RUNNER_TEMP/app-store-lookup.json"
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 2 \
            "https://itunes.apple.com/lookup?id=${IOS_APP_STORE_ID}&country=cn" \
            --output "$LOOKUP_RESPONSE"

          LOOKUP_RESPONSE="$LOOKUP_RESPONSE" node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const payload = JSON.parse(fs.readFileSync(process.env.LOOKUP_RESPONSE, 'utf8'))
          const appId = Number(process.env.IOS_APP_STORE_ID)
          const result = Array.isArray(payload?.results)
            ? payload.results.find((entry) => Number(entry?.trackId) === appId)
            : undefined
          if (!result) throw new Error('Apple public lookup did not return the configured RPBox app')
          if (result.version !== process.env.VERSION) {
            throw new Error(`Apple public version ${result.version || 'unknown'} does not match ${process.env.VERSION}`)
          }
          NODE

      - name: Resolve public iOS URL
        id: public_url
        shell: bash
        env:
          IOS_PUBLIC_UPDATE_URL: ${{ secrets.IOS_PUBLIC_UPDATE_URL }}
          IOS_APP_STORE_URL: ${{ secrets.IOS_APP_STORE_URL }}
        run: |
          set -euo pipefail

          if [ -n "${IOS_PUBLIC_UPDATE_URL:-}" ]; then
            URL="$IOS_PUBLIC_UPDATE_URL"
          elif [ -n "${IOS_APP_STORE_URL:-}" ]; then
            URL="$IOS_APP_STORE_URL"
          else
            URL="${{ env.IOS_DEFAULT_PUBLIC_URL }}"
          fi

          VALIDATED_URL="$(IOS_PUBLIC_UPDATE_URL="$URL" node ./mobile/scripts/iosCompliance.mjs validate-public-update-url)"
          printf 'URL=%s\n' "$VALIDATED_URL" >> "$GITHUB_OUTPUT"

      - name: Prepare iOS metadata
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          RELEASE_NOTES: ${{ steps.notes.outputs.NOTES }}
          PUBLIC_URL: ${{ steps.public_url.outputs.URL }}
        run: |
          set -euo pipefail
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export VERSION RELEASE_NOTES PUBLIC_URL PUB_DATE
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"].strip()
          notes = os.environ.get("RELEASE_NOTES", "").strip().replace("\r\n", "\n").replace("\r", "\n")
          public_url = os.environ["PUBLIC_URL"].strip()
          pub_date = os.environ["PUB_DATE"].strip()

          data = {
              "latest_version": version,
              "version": version,
              "notes": notes,
              "pub_date": pub_date,
              "url": public_url,
              "mandatory": False,
          }

          Path("latest-ios.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Resolve SSH port
        shell: bash
        env:
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          if [ -z "${SERVER_HOST:-}" ] || [ -z "${SERVER_USER:-}" ]; then
            echo "Missing server deployment host or user"
            exit 1
          fi
          PORT="${SERVER_PORT:-2233}"
          if ! [[ "$PORT" =~ ^[0-9]+$ ]] || [ "$PORT" -lt 1 ] || [ "$PORT" -gt 65535 ]; then
            echo "SERVER_PORT must be an integer between 1 and 65535"
            exit 1
          fi
          echo "RESOLVED_SERVER_PORT=$PORT" >> "$GITHUB_ENV"

      - name: Add server to known_hosts
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          ssh-keyscan -H -p "$RESOLVED_SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload iOS metadata
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          MOBILE_RELEASE_PATH: ${{ secrets.MOBILE_RELEASE_PATH }}
          RELEASE_PATH: ${{ secrets.RELEASE_PATH }}
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.VERSION }}"
          REMOTE_BASE="${MOBILE_RELEASE_PATH:-}"
          if [ -z "$REMOTE_BASE" ]; then
            REMOTE_BASE="${RELEASE_PATH:-}/mobile"
          fi
          if [ -z "${SERVER_HOST:-}" ] || [ -z "${SERVER_USER:-}" ] || [ -z "${RELEASE_PATH:-}${MOBILE_RELEASE_PATH:-}" ]; then
            echo "Missing server deployment configuration"
            exit 1
          fi
          REMOTE_DIR="$REMOTE_BASE/$VERSION"

          ssh -p "$RESOLVED_SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "mkdir -p '$REMOTE_DIR' '$REMOTE_BASE'"

          REMOTE_META_VER_FINAL="$REMOTE_DIR/latest-ios.json"
          REMOTE_META_VER_TMP="$REMOTE_META_VER_FINAL.part"
          REMOTE_META_LATEST_FINAL="$REMOTE_BASE/latest-ios.json"
          REMOTE_META_LATEST_TMP="$REMOTE_META_LATEST_FINAL.part"

          scp -P "$RESOLVED_SERVER_PORT" -C latest-ios.json "$SERVER_USER@$SERVER_HOST:$REMOTE_META_VER_TMP"
          ssh -p "$RESOLVED_SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "mv -f '$REMOTE_META_VER_TMP' '$REMOTE_META_VER_FINAL'"

          scp -P "$RESOLVED_SERVER_PORT" -C latest-ios.json "$SERVER_USER@$SERVER_HOST:$REMOTE_META_LATEST_TMP"
          ssh -p "$RESOLVED_SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "mv -f '$REMOTE_META_LATEST_TMP' '$REMOTE_META_LATEST_FINAL'"
