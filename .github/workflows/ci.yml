name: TA6 Public Candidate Build Only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ta6-public-server-delivery
  cancel-in-progress: false
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert task branch
        run: test "$GITHUB_REF_NAME" = task/ta6-public-beta-20261007-13
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache-dependency-path: server/go.sum
      - name: Focused compatibility checks and standard Linux build
        working-directory: server
        run: |
          go test ./internal/api -run '^(TestPostCommentCompatibilityPreservesVisibilityAndStoredContent|TestItemCommentCompatibilityPreservesVisibilityAndStoredContent)$' -count=1
          go build -o rpbox-server cmd/server/main.go
      - name: Freeze deployment identity
        run: |
          mkdir delivery
          cp server/rpbox-server delivery/
          cp scripts/ta6-deploy-server.sh delivery/deploy-server.sh
          cd delivery
          sha256sum rpbox-server > binary.sha256
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          paths=['comment.go','item.go','comment_compatibility.go','comment_compatibility_test.go','item_comment_compatibility_test.go']
          hashes={p:hashlib.sha256((pathlib.Path('../server/internal/api')/p).read_bytes()).hexdigest() for p in paths}
          record={'sourceCommit':os.environ['GITHUB_SHA'],'baseline':'37331934509b9f385fdc3ec71550aaeef851cbb2','serverBaseline':'eb9462c06af755e2548b1365222fa56f9ba07248','serverFileHashes':hashes,'buildCommand':'go build -o rpbox-server cmd/server/main.go','goVersion':'1.25.13','target':'linux/amd64','apiBase':'https://ksxvodevhonx.sealosbja.site/api/v1'}
          pathlib.Path('manifest.json').write_text(json.dumps(record,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ta6-linux-server-delivery
          path: delivery/
