name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  GO_VERSION: '1.24.x'

jobs:
  # 后端构建
  server:
    name: Server Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -o rpbox-server cmd/server/main.go

  # 部署
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [server]

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2233
          script: |
            set -e
            cd ~/RPBox

            # 备份 storage 目录中的运行时数据（不受 git 管理）
            echo "Backing up storage data..."
            if [ -d server/storage/addons ]; then
              cp -r server/storage/addons /tmp/rpbox_addons_backup
            fi

            git fetch origin main
            git reset --hard origin/main

            # 恢复 storage 备份
            echo "Restoring storage data..."
            if [ -d /tmp/rpbox_addons_backup ]; then
              mkdir -p server/storage/addons
              cp -r /tmp/rpbox_addons_backup/* server/storage/addons/
              rm -rf /tmp/rpbox_addons_backup
            fi

            # 写入生产后端运行时密钥。文件不进仓库，config.Load 会在启动时读取。
            tmp_env="$(mktemp)"
            cat > "$tmp_env" <<'RPBOX_ENV'
            TRP3_ADDONS_PROXY_URL=${{ secrets.TRP3_ADDONS_PROXY_URL }}
            GITHUB_TOKEN=${{ secrets.TRP3_GITHUB_TOKEN }}
            RPBOX_ENV
            mkdir -p server
            sed -e 's/^[[:space:]]*//' "$tmp_env" | grep -v -E '^[A-Z0-9_]+=$' > server/.env || true
            chmod 600 server/.env
            rm -f "$tmp_env"

            cd server
            echo "Building server..."
            go build -o rpbox-server cmd/server/main.go
            if [ ! -f rpbox-server ]; then
              echo "Build failed: rpbox-server not found"
              exit 1
            fi
            echo "Build successful, restarting service..."
            sudo supervisorctl restart rpbox
            sleep 2
            sudo supervisorctl status rpbox
