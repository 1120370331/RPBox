name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  GO_VERSION: '1.25.13'

jobs:
  # 后端构建
  server:
    name: Server Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -o rpbox-server cmd/server/main.go

  # 部署
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [server]

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2233
          script: |
            set -e
            cd ~/RPBox

            # 备份 storage 目录中的运行时数据（不受 git 管理）
            echo "Backing up storage data..."
            if [ -d server/storage/addons ]; then
              cp -r server/storage/addons /tmp/rpbox_addons_backup
            fi

            git fetch origin main
            git reset --hard origin/main

            # 恢复 storage 备份
            echo "Restoring storage data..."
            if [ -d /tmp/rpbox_addons_backup ]; then
              mkdir -p server/storage/addons
              cp -r /tmp/rpbox_addons_backup/* server/storage/addons/
              rm -rf /tmp/rpbox_addons_backup
            fi

            # Preserve the explicit proxy trust boundary introduced by the
            # server security middleware. The production ingress terminates
            # TLS locally before forwarding to RPBox.
            if [ -f server/config.yaml ] && ! grep -Eq '^[[:space:]]+trusted_proxies:' server/config.yaml; then
              grep -Eq '^server:[[:space:]]*$' server/config.yaml
              sed -i '/^server:[[:space:]]*$/a\  trusted_proxies:\n    - "127.0.0.0/8"\n    - "::1/128"' server/config.yaml
            fi

            # 写入生产后端运行时密钥。文件不进仓库，config.Load 会在启动时读取。
            tmp_env="$(mktemp)"
            cat > "$tmp_env" <<'RPBOX_ENV'
            TRP3_ADDONS_PROXY_URL=${{ secrets.TRP3_ADDONS_PROXY_URL }}
            GITHUB_TOKEN=${{ secrets.TRP3_GITHUB_TOKEN }}
            RPBOX_ENV
            mkdir -p server
            sed -e 's/^[[:space:]]*//' "$tmp_env" | grep -v -E '^[A-Z0-9_]+=$' > server/.env || true
            chmod 600 server/.env
            rm -f "$tmp_env"

            cd server
            echo "Building server..."
            GOTOOLCHAIN=go${{ env.GO_VERSION }} go build -o rpbox-server cmd/server/main.go
            chmod 755 rpbox-server
            if [ ! -x rpbox-server ]; then
              echo "Build failed: rpbox-server is missing or not executable"
              exit 1
            fi

            echo "Stopping any stale startup backup before restart..."
            pgrep -af '^pg_dump ' | awk '/storage\/backups/ { print $1 }' | xargs -r kill -TERM

            echo "Build successful, restarting service..."
            if ! sudo supervisorctl status >/dev/null 2>&1; then
              echo "supervisorctl is unavailable, clearing stale supervisor sockets and starting supervisord..."
              sudo rm -f /run/supervisor.sock /var/run/supervisor.sock /run/supervisord.pid /var/run/supervisord.pid
              sudo supervisord -c /etc/supervisor/supervisord.conf
              sleep 3
            fi
            sudo supervisorctl restart rpbox || sudo supervisorctl start rpbox

            echo "Waiting for local health check..."
            server_port="$(awk '/^server:/{in_server=1; next} in_server && /^[^[:space:]]/{exit} in_server && /^[[:space:]]+port:/{print $2; exit}' config.yaml | tr -d '"')"
            server_port="${server_port:-8080}"
            for i in $(seq 1 30); do
              health_status="$(curl -sS -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Proto: https' "http://127.0.0.1:${server_port}/api/v1/updater/windows/x86_64/0.0.0" || true)"
              if [ "$health_status" = "200" ]; then
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Health check failed"
                sudo supervisorctl status || true
                sudo supervisorctl tail -200 rpbox stderr || true
                exit 1
              fi
              sleep 2
            done
            sudo supervisorctl status rpbox
