name: Release Cleanup

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Survey only, or prune inactive desktop releases and package caches'
        required: true
        default: survey
        type: choice
        options:
          - survey
          - prune

permissions:
  contents: read

concurrency:
  group: production-disk-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Clean reproducible files on production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Survey or prune production disk
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          RELEASE_PATH: ${{ secrets.RELEASE_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          MODE: ${{ github.event_name == 'schedule' && 'prune' || inputs.mode }}
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf -- "$temp_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$temp_dir/deploy.key"
          chmod 600 "$temp_dir/deploy.key"
          if [[ -n "$SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$temp_dir/known_hosts"
          else
            ssh-keyscan -4 -T 30 -p 2233 "$SERVER_HOST" > "$temp_dir/known_hosts"
          fi
          test -s "$temp_dir/known_hosts"
          remote_command="bash -s -- $(printf '%q' "$MODE") $(printf '%q' "$RELEASE_PATH")"
          ssh -p 2233 -i "$temp_dir/deploy.key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$temp_dir/known_hosts" -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" "$remote_command" < scripts/cleanup-production-disk.sh
