name: SSH Deploy Probe

# Temporary diagnostic workflow: reproduces the Windows publish step without building an installer.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe Windows SSH deploy
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Probe
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          RELEASE_PATH: ${{ secrets.RELEASE_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $tempDirectory = Join-Path ([IO.Path]::GetTempPath()) ("rpbox-probe-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $tempDirectory | Out-Null
          $keyPath = Join-Path $tempDirectory 'deploy.key'
          $knownHosts = Join-Path $tempDirectory 'known_hosts'
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          & icacls $tempDirectory /inheritance:r /grant:r "*${sid}:(OI)(CI)F" | Out-Null
          ($env:SSH_PRIVATE_KEY.Trim().Replace("`r", '') + "`n") | Set-Content -LiteralPath $keyPath -NoNewline -Encoding utf8NoBOM
          $keyscan = Join-Path (Split-Path -Parent (Get-Command git).Source) '../usr/bin/ssh-keyscan.exe'
          & $keyscan -4 -T 30 -p 2233 $env:SERVER_HOST | Set-Content -LiteralPath $knownHosts -Encoding utf8NoBOM
          Write-Host "key=$keyPath size=$((Get-Item $keyPath).Length) known=$((Get-Item $knownHosts).Length)"

          function Invoke-TransferCommand {
            param([string]$Program, [string[]]$Arguments)
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              & $Program @Arguments 2>&1 | ForEach-Object { Write-Host "$_" }
              Write-Host "inner attempt=$attempt exit=$LASTEXITCODE"
              if ($LASTEXITCODE -eq 0) { return }
              Start-Sleep -Seconds 3
            }
            throw "$Program failed after 3 attempt(s)."
          }

          $common = @('-F', 'none', '-i', $keyPath, '-o', 'IdentitiesOnly=yes', '-o', 'BatchMode=yes', '-o', 'StrictHostKeyChecking=yes', '-o', "UserKnownHostsFile=`"$knownHosts`"", '-o', 'ConnectTimeout=30', '-o', 'ServerAliveInterval=15', '-o', 'ServerAliveCountMax=4')
          $target = "$($env:SERVER_USER)@$($env:SERVER_HOST)"
          $staging = "$($env:RELEASE_PATH.TrimEnd('/'))/.probe-" + [guid]::NewGuid().ToString('N')

          Write-Host '=== direct call with -v'
          & ssh '-v' (@('-p', '2233') + $common) @($target, "mkdir -p '$staging'") 2>&1 | ForEach-Object { Write-Host "| $_" }
          Write-Host "direct exit=$LASTEXITCODE"

          Write-Host '=== function call without -v (same as the script)'
          try {
            Invoke-TransferCommand 'ssh' (@('-p', '2233') + $common + @($target, "mkdir -p '$staging'"))
            Write-Host 'function call succeeded'
          } catch {
            Write-Host "function call failed: $($_.Exception.Message)"
          }

          & ssh (@('-p', '2233') + $common) @($target, "rmdir '$staging' || true") 2>&1 | Out-Null
          Remove-Item -LiteralPath $tempDirectory -Recurse -Force -ErrorAction SilentlyContinue
