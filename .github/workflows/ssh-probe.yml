name: SSH Deploy Probe

# Temporary diagnostic workflow: reproduces the Windows publish step without building an installer.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe Windows SSH deploy
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts

      - name: Probe publish script with fake artifacts
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          RELEASE_PATH: ${{ secrets.RELEASE_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          $ErrorActionPreference = 'Continue'
          $temp = Join-Path $env:RUNNER_TEMP 'probe'
          New-Item -ItemType Directory -Force -Path (Join-Path $temp 'art') | Out-Null
          $names = @('RPBox_1.0.6-6_x64-setup.exe', 'RPBox_1.0.6-6_x64-setup.exe.sig', 'latest.json')
          foreach ($name in $names) {
            $path = Join-Path $temp "art/$name"
            if ($name -eq 'latest.json') {
              '{"latest_version":"1.0.6-6","notes":"probe","channel":"beta"}' | Set-Content -LiteralPath $path -Encoding utf8NoBOM
            } else {
              'probe' | Set-Content -LiteralPath $path -Encoding utf8NoBOM
            }
          }
          $sums = foreach ($name in $names) {
            (Get-FileHash -LiteralPath (Join-Path $temp "art/$name") -Algorithm SHA256).Hash.ToLowerInvariant() + "  $name"
          }
          [IO.File]::WriteAllText((Join-Path $temp 'art/SHA256SUMS'), ($sums -join "`n") + "`n", [Text.UTF8Encoding]::new($false))

          Write-Host '=== running publish script (verify only)'
          $output = @(& ./scripts/publish-client-release.ps1 -Version 1.0.6-6 -Channel beta -ArtifactDirectory (Join-Path $temp 'art') -ServerHost $env:SERVER_HOST -ServerUser $env:SERVER_USER -RemotePath $env:RELEASE_PATH -VerifyOnly 2>&1 | ForEach-Object { "$_" })
          $code = $LASTEXITCODE
          Write-Host "=== publish exit=$code"
          foreach ($line in $output) { Write-Host "| $line" }
          exit 0
