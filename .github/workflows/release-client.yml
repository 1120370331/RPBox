name: Release Client

on:
  push:
    tags:
      - 'v*'  # 触发条件：推送 v 开头的 tag，如 v0.2.0
      - 'beta-v*'  # 测试版 tag，如 beta-v0.2.1-1
  workflow_dispatch:
    inputs:
      version:
        description: 'Client version, for example 0.2.1 or 0.2.1-1'
        required: true
        type: string
      channel:
        description: 'Release channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
      builder:
        description: 'Windows builder (start scripts/start-local-runner.ps1 before choosing local)'
        required: true
        default: hosted
        type: choice
        options:
          - hosted
          - local
      build_only:
        description: 'Build and verify a temporary upload without publishing an update'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-client-production
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  release-meta:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      metadata_file: ${{ steps.meta.outputs.metadata_file }}
    steps:
      - name: Resolve version and channel
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            CHANNEL="$INPUT_CHANNEL"
          else
            TAG="${GITHUB_REF_NAME}"
            CHANNEL="stable"

            if [[ "$TAG" == beta-v* ]]; then
              VERSION="${TAG#beta-v}"
              CHANNEL="beta"
            else
              VERSION="${TAG#v}"
            fi

            if [[ "$VERSION" == *"-beta"* || "$VERSION" == *"-alpha"* || "$VERSION" == *"-rc"* ]]; then
              CHANNEL="beta"
            fi
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          if [ "$CHANNEL" != "stable" ] && [ "$CHANNEL" != "beta" ]; then
            echo "Invalid channel: $CHANNEL" >&2
            exit 1
          fi

          if [ "$CHANNEL" = "beta" ] && [[ "$VERSION" != *"-"* ]]; then
            echo "Beta client releases must use a numeric prerelease version for MSI, for example 0.2.1-1" >&2
            exit 1
          fi

          if [ "$CHANNEL" = "beta" ] && ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "Beta client releases must use numeric-only prerelease identifiers for MSI, for example 0.2.1-1" >&2
            exit 1
          fi

          METADATA_FILE="latest.json"
          if [ "$CHANNEL" = "beta" ]; then
            METADATA_FILE="latest-beta.json"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "metadata_file=$METADATA_FILE" >> "$GITHUB_OUTPUT"
          echo "Resolved client release: version=$VERSION channel=$CHANNEL metadata_file=$METADATA_FILE"

  build-windows:
    name: Build and Publish Windows Client
    # Tags keep using hosted Windows. Local execution is an explicit dispatch choice.
    runs-on: ${{ fromJSON(inputs.builder == 'local' && '["self-hosted", "Windows", "X64", "rpbox-release"]' || '["windows-latest"]') }}
    needs: release-meta
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ needs.release-meta.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.release-meta.outputs.channel }}
      RUSTUP_TOOLCHAIN: stable

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Avoid downloading mobile screenshots, marketing assets and reference repos.
          sparse-checkout: |
            client
            shared
            scripts

      - name: Configure persistent local build cache
        run: |
          $target = Join-Path $env:GITHUB_WORKSPACE 'client/src-tauri/target'
          if ('${{ runner.environment }}' -eq 'self-hosted') {
            # Outside checkout: checkout can safely clean source and node_modules.
            $target = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_WORKSPACE '../_rpbox-cache/cargo-target'))
          }
          "CARGO_TARGET_DIR=$target" >> $env:GITHUB_ENV
          "RELEASE_ARTIFACT_DIR=$(Join-Path $env:RUNNER_TEMP "client-release-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")" >> $env:GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Rust on hosted Windows
        if: runner.environment == 'github-hosted'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies on hosted Windows
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: client/src-tauri -> target

      - name: Verify local Rust toolchain
        if: runner.environment == 'self-hosted'
        run: |
          rustup run stable cargo --version
          if ($LASTEXITCODE -ne 0) { throw 'Install stable Rust before starting the runner.' }

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: client

      - name: Sync client version files
        run: node scripts/sync-client-version.mjs $env:RELEASE_VERSION

      - name: Build signed NSIS installer
        working-directory: client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_API_BASE: https://ksxvodevhonx.sealosbja.site/api/v1
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing updater signing key.' }
          $installer = Join-Path $env:CARGO_TARGET_DIR "release/bundle/nsis/RPBox_$($env:RELEASE_VERSION)_x64-setup.exe"
          # Never reuse a stale same-version package or signature after a failed build.
          foreach ($file in @($installer, "$installer.sig")) {
            if (Test-Path -LiteralPath $file) { Remove-Item -LiteralPath $file -Force }
          }
          npm run tauri -- build --ci --bundles nsis -- --locked
          if ($LASTEXITCODE -ne 0) { throw 'Tauri build failed.' }

      - name: Prepare exact release artifacts
        env:
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          ./scripts/prepare-client-release.ps1 -Version $env:RELEASE_VERSION -Channel $env:RELEASE_CHANNEL -BundleDirectory (Join-Path $env:CARGO_TARGET_DIR 'release/bundle/nsis') -OutputDirectory $env:RELEASE_ARTIFACT_DIR -TagName $env:TAG_NAME

      - name: Archive installer and signature
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            ${{ env.RELEASE_ARTIFACT_DIR }}/RPBox_${{ env.RELEASE_VERSION }}_x64-setup.exe
            ${{ env.RELEASE_ARTIFACT_DIR }}/RPBox_${{ env.RELEASE_VERSION }}_x64-setup.exe.sig
            ${{ env.RELEASE_ARTIFACT_DIR }}/latest.json
            ${{ env.RELEASE_ARTIFACT_DIR }}/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload directly from the builder (verify only when build_only)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          RELEASE_PATH: ${{ secrets.RELEASE_PATH }}
          VERIFY_ONLY: ${{ inputs.build_only == true }}
        run: |
          ./scripts/publish-client-release.ps1 -Version $env:RELEASE_VERSION -Channel $env:RELEASE_CHANNEL -ArtifactDirectory $env:RELEASE_ARTIFACT_DIR -ServerHost $env:SERVER_HOST -ServerUser $env:SERVER_USER -RemotePath $env:RELEASE_PATH -VerifyOnly:($env:VERIFY_ONLY -eq 'true')

  update-pages:
    name: Update GitHub Pages
    runs-on: ubuntu-latest
    needs:
      - release-meta
      - build-windows
    if: needs.release-meta.outputs.channel == 'stable' && inputs.build_only != true
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update fallback version in download.html
        run: |
          VERSION=${{ needs.release-meta.outputs.version }}
          sed -i "s/var fallbackVersion = '.*'/var fallbackVersion = '${VERSION}'/" shared/download.html
          echo "Updated fallbackVersion to ${VERSION}"
          grep fallbackVersion shared/download.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shared/download.html
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update download page fallback version to v${{ needs.release-meta.outputs.version }}"
          git push origin main
