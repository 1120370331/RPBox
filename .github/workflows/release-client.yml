name: TA6 Beta Publish Only

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Client version, for example 0.2.1 or 0.2.1-1'
        required: true
        type: string
      channel:
        description: 'Release channel'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta

env:
  NODE_VERSION: '20'

permissions:
  contents: read
  actions: read
concurrency:
  group: ta6-beta-publish
  cancel-in-progress: false
jobs:
  release-meta:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      metadata_file: ${{ steps.meta.outputs.metadata_file }}
    steps:
      - name: Resolve version and channel
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          test '${{ inputs.channel }}' = beta
          test '${{ inputs.version }}' = 1.0.5-14

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            CHANNEL="${{ inputs.channel }}"
          else
            TAG="${GITHUB_REF_NAME}"
            CHANNEL="stable"

            if [[ "$TAG" == beta-v* ]]; then
              VERSION="${TAG#beta-v}"
              CHANNEL="beta"
            else
              VERSION="${TAG#v}"
            fi

            if [[ "$VERSION" == *"-beta"* || "$VERSION" == *"-alpha"* || "$VERSION" == *"-rc"* ]]; then
              CHANNEL="beta"
            fi
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          if [ "$CHANNEL" != "stable" ] && [ "$CHANNEL" != "beta" ]; then
            echo "Invalid channel: $CHANNEL" >&2
            exit 1
          fi

          if [ "$CHANNEL" = "beta" ] && [[ "$VERSION" != *"-"* ]]; then
            echo "Beta client releases must use a numeric prerelease version for MSI, for example 0.2.1-1" >&2
            exit 1
          fi

          if [ "$CHANNEL" = "beta" ] && ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "Beta client releases must use numeric-only prerelease identifiers for MSI, for example 0.2.1-1" >&2
            exit 1
          fi

          METADATA_FILE="latest.json"
          if [ "$CHANNEL" = "beta" ]; then
            METADATA_FILE="latest-beta.json"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "metadata_file=$METADATA_FILE" >> "$GITHUB_OUTPUT"
          echo "Resolved client release: version=$VERSION channel=$CHANNEL metadata_file=$METADATA_FILE"

  build-windows:
    name: Build Windows Client
    runs-on: windows-latest
    needs: release-meta

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Sync client version files
        run: node scripts/sync-client-version.mjs "${{ needs.release-meta.outputs.version }}"

      - name: Show synced versions
        shell: pwsh
        run: |
          Write-Host "tauri.conf.json version:"
          (Get-Content client/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          Write-Host "Cargo.toml package version:"
          (Select-String -Path client/src-tauri/Cargo.toml -Pattern '^version = ".*"$' | Select-Object -First 1).Line
          Write-Host "package.json version:"
          (Get-Content client/package.json -Raw | ConvertFrom-Json).version

      - name: Build Tauri app
        run: npm run tauri build
        working-directory: client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_API_BASE: https://ksxvodevhonx.sealosbja.site/api/v1

      - name: List bundle outputs
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Force client/src-tauri/target/release/bundle

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: client/src-tauri/target/release/bundle/**
          if-no-files-found: error

  deploy-beta:
    name: Publish only beta installers and metadata
    runs-on: ubuntu-latest
    needs: [release-meta, build-windows]
    if: needs.release-meta.outputs.channel == 'beta'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Reuse existing release SSH endpoint
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: ssh-keyscan -H -p 2233 "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Publish beta with occupancy and stable preservation guards
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          RELEASE_PATH: ${{ secrets.RELEASE_PATH }}
          VERSION: ${{ needs.release-meta.outputs.version }}
        run: python3 scripts/ta6-beta-publish.py
      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-publication-evidence
          path: beta-publication-*.json
          if-no-files-found: warn
