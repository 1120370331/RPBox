name: TA6 Local Client Package
on:
  workflow_dispatch:
    inputs:
      version:
        description: Frozen task version
        required: true
        type: string
      channel:
        description: Task only, no release deployment
        default: beta
        type: choice
        options: [beta]
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Assert task configuration
        shell: pwsh
        run: |
          $config = Get-Content -Raw client/src-tauri/tauri.conf.json | ConvertFrom-Json
          if ($config.version -ne '${{ inputs.version }}') { throw 'Version mismatch' }
          if ($config.identifier -ne 'app.rpbox.ta6.localtest') { throw 'Identity mismatch' }
          if ($config.plugins.updater.endpoints[0] -notlike 'http://127.0.0.1:19265/*') { throw 'Unexpected updater target' }
      - name: Locked dependencies
        working-directory: client
        run: npm ci
      - name: Build and sign
        working-directory: client
        run: npm run tauri build -- --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_API_BASE: http://127.0.0.1:19262/api/v1
          VITE_UPDATER_ENDPOINT: http://127.0.0.1:19265/updater
      - name: Package evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force task-evidence | Out-Null
          $files = @(Get-ChildItem client/src-tauri/target/release/bundle/nsis -File)
          if (-not ($files | Where-Object Extension -eq '.sig')) { throw 'Missing signature' }
          $native = Get-Item client/src-tauri/target/release/rpbox-ta6-localtest.exe
          $config = Get-Content -Raw client/src-tauri/tauri.conf.json | ConvertFrom-Json
          [ordered]@{
            commit = '${{ github.sha }}'
            version = $config.version
            apiBase = 'http://127.0.0.1:19262/api/v1'
            identifier = $config.identifier
            productName = $config.productName
            publicUpdaterKey = $config.plugins.updater.pubkey
            nativeProductVersion = $native.VersionInfo.ProductVersion
            nativeSHA256 = (Get-FileHash $native.FullName).Hash
            files = @($files | ForEach-Object { [ordered]@{ name=$_.Name; bytes=$_.Length; sha256=(Get-FileHash $_.FullName).Hash } })
            localOnly = $true
            globalMetadataWritten = $false
          } | ConvertTo-Json -Depth 6 | Set-Content task-evidence/package-manifest.json
          Copy-Item client/src-tauri/tauri.conf.json task-evidence/tauri.conf.json
          Copy-Item $native.FullName task-evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: ta6-local-client-package
          path: |
            client/src-tauri/target/release/bundle/nsis/**
            client/dist/**
            task-evidence/**
          if-no-files-found: error
          retention-days: 14
