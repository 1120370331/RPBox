server:
  port: "8080"
  mode: "debug"
  max_body_size_mb: 200
  # HTTPS API origin used for release-mode redirects. It must not include a path.
  api_host: "https://api.example.com"
  # Only list the actual reverse proxy peers that connect directly to RPBox.
  # Leave empty when RPBox is exposed directly. Never use 0.0.0.0/0 or ::/0.
  # The private range below is an example for a reverse proxy on a Docker/LAN network;
  # narrow it to the real proxy address or subnet in production.
  trusted_proxies:
    - "127.0.0.1/32"
    - "::1/128"
    - "172.16.0.0/12"

cors:
  allowed_origins:
    - "https://totalrpbox.com"
    - "https://www.totalrpbox.com"
    - "https://rpbox.com"
    - "https://www.rpbox.com"
    - "https://ksxvodevhonx.sealosbja.site"
    - "tauri://localhost"
    - "https://tauri.localhost"
  dev_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "http://localhost:1420"
    - "http://127.0.0.1:1420"

rate_limit:
  global:
    rps: 100
    burst: 200
  auth:
    rps: 1
    burst: 3
  api:
    rps: 30
    burst: 60

database:
  host: "localhost"
  port: "5432"
  user: "postgres"
  password: "your-database-password"
  dbname: "rpbox"

backup:
  enabled: false
  interval_minutes: 60
  retention_days: 30
  local_dir: "storage/backups"
  environment: "dev"
  pg_dump_path: "pg_dump"
  run_on_start: true
  timeout_minutes: 60
  oss:
    enabled: false
    endpoint: "oss-cn-beijing.aliyuncs.com"
    internal_endpoint: "oss-cn-beijing-internal.aliyuncs.com"
    use_internal: false
    use_https: true
    use_cname: false
    bucket: "your-backup-bucket"
    access_key_id: "your-access-key-id"
    access_key_secret: "your-access-key-secret"
    prefix: "db-backups"

jwt:
  secret: "your-secret-key-change-in-production"
  expire: 72

storage:
  path: "storage"

oss:
  enabled: false
  endpoint: "oss-cn-shanghai.aliyuncs.com"
  bucket: "your-bucket-name"
  access_key_id: ""
  access_key_secret: ""
  prefix: "images"

curseforge:
  enabled: true
  api_key: "" # 建议生产环境使用 CURSEFORGE_API_KEY 环境变量注入
  base_url: "https://api.curseforge.com"
  timeout_seconds: 10
  cache_ttl_minutes: 360

trp3_addons:
  enabled: true
  github_api_base_url: "https://api.github.com"
  # 可选：GitHub 下载镜像。支持两种形式：
  # 1. "https://mirror.example.com/{raw_url}" 直接替换原始 URL
  # 2. "https://gh-proxy.example.com/" 拼接原始 GitHub URL
  github_download_mirror_base_url: ""
  github_token: "" # 可选，生产环境建议使用 GITHUB_TOKEN 环境变量提高 API 限额
  # 可选：Roxy 等代理，支持 http/https/socks5/socks5h。推荐用 TRP3_ADDONS_PROXY_URL 环境变量注入。
  # 示例：socks5://username:password@192.0.2.10:5782
  proxy_url: ""
  cache_enabled: true
  # TRP3/TRPEx/Musician zip 首次下载后会缓存到 storage/cache/addons/trp3，并在 OSS 启用时同步到 OSS。
  cache_subdir: "cache/addons/trp3"
  max_download_mb: 256
  timeout_seconds: 15
  cache_ttl_minutes: 360

redis:
  host: "localhost"
  port: "6379"
  password: ""
  db: 0

smtp:
  host: "smtp.126.com"
  port: 465
  username: "your-email@126.com"
  password: "your-smtp-auth-code"
  from: "your-email@126.com"

# 客户端更新配置
updater:
  latest_version: "0.1.5"
  base_url: "http://localhost:8080/releases"
  release_notes: "版本更新说明"
  pub_date: "2026-01-17T12:00:00Z"
  signature_dir: ""
  mobile:
    android:
      latest_version: "0.1.0"
      url: "https://api.rpbox.app/releases/mobile/0.1.0/RPBox_0.1.0_android.apk"
      release_notes: "移动端版本更新说明"
      pub_date: "2026-03-22T12:00:00Z"
      mandatory: false
    ios:
      latest_version: "0.1.0"
      url: "https://apps.apple.com/app/rpbox/id1234567890"
      release_notes: "移动端版本更新说明"
      pub_date: "2026-03-22T12:00:00Z"
      mandatory: false
